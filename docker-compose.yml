services:
  php:
    build: 
      context: .
      target: php 
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=production
    # "command: php-fpm" 

  web:
    build: 
      context: .
      target: web 
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html

  pgsql:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ficct
      - POSTGRES_USER=ficct
      - POSTGRES_PASSWORD=ficct
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: